version: '3.8'
services:
  APPLICATION_SERVICE:
    image: application:v1
    container_name: application-container
    ports:
      - "8081:80"
    depends_on:
      - mysql
    environment:
      - PORT=5003
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=naukri
      - DB_PASSWORD=naukri123
      - DB_NAME=naukri_db
      - JWT_SECRET=naukri_secret_dev_change_me
      - JOB_SERVICE_URL=http://localhost:5002
      - USER_SERVICE_URL=http://localhost:5001
    networks:
      - app-network
  JOB_SERVICE:
    image: job:v1
    container_name: job
    ports:
      - "8082:80"
    depends_on:
      - mysql
    environment:
      - PORT=5002
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=naukri
      - DB_PASSWORD=naukri123
      - DB_NAME=naukri_db
      - JWT_SECRET=naukri_secret_dev_change_me
    networks:
      - app-network
  USER_SERVICE:
    image: user-service:v1
    container_name: user
    ports:
      - "8083:80"
    depends_on:
      - mysql
    environment:
      - PORT=5001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=naukri
      - DB_PASSWORD=naukri123
      - DB_NAME=naukri_db
      - JWT_SECRET=naukri_secret_dev_change_me
      - JWT_EXPIRES_IN=7d
    networks:
      - app-network
  GATEWAY:
    image: gateway:v1
    container_name: gateway
    ports: 
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      - PORT=5000
      - USER_SERVICE_URL=http://localhost:5001
      - JOB_SERVICE_URL=http://localhost:5002
      - APPLICATION_SERVICE_URL=http://localhost:5003
    networks:
      - app-network
  mysql:
    image: mysql:latest
    container_name: sql
    ports:
      - "3306:3306"
    volumes:
      - "sql-volume: /var/lib/mysql"
    networks:
      - app-network
volumes:
  sql-volume:
networks:
  app-network:
    driver: bridge
    
  

   

